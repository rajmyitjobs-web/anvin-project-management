name: Build and deploy the Azure pilot

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        with:
          dotnet-version: 10.0.x

      - name: Publish and check the Windows application
        run: |
          dotnet publish source/MyProjectManagement.csproj -c Release -r win-x86 \
            --self-contained false -p:UseAppHost=false -o dist
          test -s dist/web.config
          test -s dist/MyProjectManagement.dll
          test -s dist/wwwroot/index.html
          cd dist
          zip -qr ../release.zip .

      - name: Save the tested package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: azure-pilot-package
          path: release.zip
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    if: github.repository == 'rajmyitjobs-web/anvin-project-management' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: anvin-project-management-azure-pilot
      cancel-in-progress: false
    steps:
      - name: Download the tested package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: azure-pilot-package

      - name: Sign in to Azure with OpenID Connect
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to the pilot Web App
        id: publish
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release.zip

      - name: Verify application startup
        env:
          APP_URL: ${{ steps.publish.outputs.webapp-url }}
        run: |
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 35 "${APP_URL%/}/api/health" \
            | jq -e '.status == "running" and (.version | type == "string")'
